<!DOCTYPE html><html class="light" lang="en"><head>

                        "surface-container-high": "#e7e8e9",

                        "on-secondary-fixed": "#141b2b",

                        "tertiary": "#4e5562",

                        "surface": "#f8f9fa",
                        "primary": "#004ac6",
                        "on-secondary": "#ffffff",
                        "secondary": "#575e70",
                        "on-tertiary-fixed-variant": "#404754",
                        "on-primary-fixed": "#00174b",
                        "secondary-fixed-dim": "#c0c6db",
                        "inverse-surface": "#2e3132",
                        "background": "#f8f9fa",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-low": "#f3f4f5",
                        "on-background": "#191c1d",
                        "on-primary": "#ffffff",
                        "outline": "#737686",
                        "on-surface-variant": "#434655",
                        "on-primary-container": "#eeefff",
                        "tertiary-fixed": "#dce2f3",
                        "secondary-container": "#d9dff5",
                        "on-error": "#ffffff",
                        "surface-variant": "#e1e3e4",
                        "error": "#ba1a1a",
                        "on-secondary-container": "#5c6274",

                        "secondary-fixed": "#dce2f7",

                        "error-container": "#ffdad6",
                        "surface-bright": "#f8f9fa",
                        "primary-container": "#2563eb",
                        "outline-variant": "#c3c6d7",
                        "surface-container-highest": "#e1e3e4",
                        "on-error-container": "#93000a",
                        "on-secondary-fixed-variant": "#404758",
                        "on-surface": "#191c1d",
                        "inverse-primary": "#b4c5ff",
                        "tertiary-fixed-dim": "#c0c7d6",
                        "primary-fixed-dim": "#b4c5ff"

                    "borderRadius": {

                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem",
                        "24px": "24px"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "xl": "32px",
                        "margin-desktop": "48px",
                        "margin-mobile": "16px",
                        "lg": "24px",
                        "xs": "4px",
                        "sm": "8px",
                        "unit": "4px",

                        "button": "54px"
                    },
                    "fontFamily": {

                        "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "500"}],
                        "display-lg-mobile": ["26px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700"}],

                        "mono-label": ["11px", {"lineHeight": "14px", "fontWeight": "500"}]

                },
            },
        }

<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .file-drop-area {
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }
        .file-drop-area.dragover {
            border-color: #2563eb;
            background-color: #f0f1f2;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-surface antialiased min-h-screen flex flex-col md:hidden">
<!-- Header -->
<header class="flex items-center justify-between px-margin-mobile h-16 w-full sticky top-0 bg-surface z-50">
<div class="flex items-center">
<button aria-label="Go back" class="p-2 -ml-2 text-on-surface-variant hover:bg-surface-container rounded-full transition-colors active:scale-95 duration-150">
<span class="material-symbols-outlined">arrow_back</span>
</button>
</div>
<div class="flex-1 text-center pl-4"> <!-- Offset for back button -->
<!-- Empty space for balance if no trailing icon, but we center the title visually by trusting the flex layout if we keep it simple -->
</div>
<div class="w-10"></div> <!-- Placeholder for right balance -->
</header>
<div class="px-margin-mobile mt-sm">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-on-surface">Upload Resume</h1>
<p class="font-body-base text-body-base text-on-surface-variant mt-xs">Import your existing resume to continue editing.</p>
</div>
<!-- Main Content -->
<main class="flex-1 px-margin-mobile flex flex-col mt-xl">
<!-- Flow Indicator -->
<div class="flex items-center space-x-2 mb-lg">
<span class="font-label-sm text-label-sm text-primary uppercase tracking-wider">Step 1 of 3</span>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider hidden sm:inline">: Upload → Extract → Continue</span>
</div>
<!-- Upload Menu -->
<div class="w-full max-w-md mx-auto" id="uploadCard">
<div class="w-full flex flex-col space-y-2" id="initialState">
<!-- Top Button -->
<button class="w-full h-14 bg-[#F5A623] text-on-primary rounded-2xl flex items-center justify-between px-6 hover:bg-[#E0961F] transition-colors shadow-sm">
<div class="flex items-center space-x-3 text-[#1C253B]">
<span class="material-symbols-outlined text-2xl font-normal">smartphone</span>
<span class="font-headline-md text-lg">From a device</span>
</div>
<span class="material-symbols-outlined text-2xl text-[#1C253B] font-bold">expand_less</span>
</button>
<!-- Expanded Menu Options -->
<div class="bg-surface-container-lowest rounded-2xl shadow-sm border border-outline-variant overflow-hidden">
<label class="flex items-center space-x-4 p-5 hover:bg-surface-container-low transition-colors cursor-pointer border-b border-outline-variant/30" for="fileUpload">
<span class="material-symbols-outlined text-2xl text-on-surface">folder</span>
<span class="font-tagline text-tagline text-on-surface">Choose File</span>
</label>
<button class="w-full flex items-center space-x-4 p-5 hover:bg-surface-container-low transition-colors border-b border-outline-variant/30">
<span class="material-symbols-outlined text-2xl text-on-surface">image</span>
<span class="font-tagline text-tagline text-on-surface">Photo Library</span>
</button>
<button class="w-full flex items-center space-x-4 p-5 hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-2xl text-on-surface">photo_camera</span>
<span class="font-tagline text-tagline text-on-surface">Take Photo</span>
</button>
</div>
<input accept=".pdf,.docx" class="hidden" id="fileUpload" type="file">
</div>
<!-- Selected File State (Hidden by default, shown via JS for demo) -->
<div class="hidden flex-col items-center w-full justify-between py-md bg-surface-container-lowest border border-outline-variant rounded-24px p-lg relative h-80" id="selectedState">
<div class="w-full flex justify-end absolute top-4 right-4">
<button class="text-on-surface-variant hover:text-error transition-colors p-2 rounded-full hover:bg-surface-container" id="removeFileBtn">
<span class="material-symbols-outlined text-xl">close</span>
</button>
</div>
<div class="flex flex-col items-center mt-8">
<div class="bg-secondary-container p-4 rounded-full mb-md relative">
<span class="material-symbols-outlined text-4xl text-primary">description</span>
<div class="absolute bottom-2 right-2 bg-primary-container text-on-primary rounded-full p-1 border-2 border-surface-container-lowest flex items-center justify-center h-6 w-6">
<span class="material-symbols-outlined text-sm font-bold">check</span>
</div>
</div>
<h3 class="font-headline-md text-headline-md text-on-surface mb-xs truncate max-w-full px-4" id="fileNameDisplay">alex_rivera_resume_2024.pdf</h3>
<p class="font-body-base text-body-base text-on-surface-variant mb-sm" id="fileSizeDisplay">2.4 MB • Ready to Import</p>
</div>
<div class="w-full mt-auto">
<button class="w-full h-button bg-primary-container text-on-primary rounded-xl font-tagline text-tagline hover:bg-primary-container/90 active:scale-95 duration-150 transition-all flex items-center justify-center space-x-2">
<span>Continue</span>
<span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</div>
</div>
</div>
</main>
<!-- Bottom Spacing for mobile safe area -->
<div class="h-8"></div>
<script>
        const dropArea = document.getElementById('uploadCard');
        const fileInput = document.getElementById('fileUpload');
        const initialState = document.getElementById('initialState');
        const selectedState = document.getElementById('selectedState');
        const removeFileBtn = document.getElementById('removeFileBtn');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const fileSizeDisplay = document.getElementById('fileSizeDisplay');

        // Prevent default drag behaviors
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropArea.addEventListener(eventName, preventDefaults, false);
            document.body.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults (e) {
            e.preventDefault();
            e.stopPropagation();
        }

        // Highlight drop area when item is dragged over it
        ['dragenter', 'dragover'].forEach(eventName => {
            dropArea.addEventListener(eventName, highlight, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropArea.addEventListener(eventName, unhighlight, false);
        });

        function highlight(e) {
            dropArea.classList.add('dragover');
        }

        function unhighlight(e) {
            dropArea.classList.remove('dragover');
        }

        // Handle dropped files
        dropArea.addEventListener('drop', handleDrop, false);

        function handleDrop(e) {
            let dt = e.dataTransfer;
            let files = dt.files;
            handleFiles(files);
        }

        // Handle file input change
        fileInput.addEventListener('change', function() {
            handleFiles(this.files);
        });

        function handleFiles(files) {
            if (files.length > 0) {
                const file = files[0];
                
                // Very basic validation for demo purposes
                if(file.size > 10 * 1024 * 1024) {
                    alert("File is too large. Max 10MB.");
                    return;
                }
                
                showSelectedState(file);
            }
        }

        function showSelectedState(file) {
            fileNameDisplay.textContent = file.name;
            fileSizeDisplay.innerHTML = `${(file.size / (1024*1024)).toFixed(2)} MB &bull; Ready to Import`;
            
            initialState.classList.add('hidden');
            selectedState.classList.remove('hidden');
            selectedState.classList.add('flex');
        }

        removeFileBtn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            
            fileInput.value = ''; // Clear input
            
            selectedState.classList.add('hidden');
            selectedState.classList.remove('flex');
            initialState.classList.remove('hidden');
            initialState.classList.add('flex');
        });
        
    </script>
</body></html>
