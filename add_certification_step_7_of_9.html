<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Vitafolio - Add Certification</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed-dim": "#c0c6db",
                        "on-tertiary-fixed-variant": "#404754",
                        "on-secondary-container": "#5c6274",
                        "surface-container-low": "#f3f4f5",
                        "on-secondary": "#ffffff",
                        "tertiary": "#4e5562",
                        "secondary": "#575e70",
                        "on-error": "#ffffff",
                        "primary": "#004ac6",
                        "on-primary-fixed-variant": "#003ea8",
                        "on-tertiary-fixed": "#151c27",
                        "primary-container": "#2563eb",
                        "tertiary-fixed": "#dce2f3",
                        "inverse-on-surface": "#f0f1f2",
                        "surface-container": "#edeeef",
                        "surface-container-high": "#e7e8e9",
                        "outline-variant": "#c3c6d7",
                        "outline": "#737686",
                        "tertiary-fixed-dim": "#c0c7d6",
                        "surface-dim": "#d9dadb",
                        "on-secondary-fixed-variant": "#404758",
                        "on-tertiary-container": "#eaf0ff",
                        "inverse-primary": "#b4c5ff",
                        "tertiary-container": "#666d7b",
                        "surface-container-highest": "#e1e3e4",
                        "secondary-fixed": "#dce2f7",
                        "on-secondary-fixed": "#141b2b",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "error-container": "#ffdad6",
                        "on-surface-variant": "#434655",
                        "on-error-container": "#93000a",
                        "primary-fixed": "#dbe1ff",
                        "secondary-container": "#d9dff5",
                        "on-background": "#191c1d",
                        "surface": "#f8f9fa",
                        "on-primary": "#ffffff",
                        "on-primary-fixed": "#00174b",
                        "surface-variant": "#e1e3e4",
                        "on-surface": "#191c1d",
                        "primary-fixed-dim": "#b4c5ff",
                        "on-primary-container": "#eeefff",
                        "background": "#f8f9fa",
                        "inverse-surface": "#2e3132",
                        "surface-bright": "#f8f9fa",
                        "surface-tint": "#0053db",
                        "error": "#ba1a1a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "margin-desktop": "48px",
                        "gutter": "16px",
                        "xs": "4px",
                        "lg": "24px",
                        "unit": "4px",
                        "xl": "32px",
                        "margin-mobile": "16px",
                        "md": "16px",
                        "sm": "8px"
                    },
                    "fontFamily": {
                        "tagline": ["Inter"],
                        "headline-md": ["Inter"],
                        "display-lg": ["Inter"],
                        "body-base": ["Inter"],
                        "display-lg-mobile": ["Inter"],
                        "mono-label": ["JetBrains Mono"],
                        "label-sm": ["Inter"]
                    },
                    "fontSize": {
                        "tagline": ["16px", { "lineHeight": "24px", "fontWeight": "500" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "display-lg": ["30px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-base": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "display-lg-mobile": ["26px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "mono-label": ["11px", { "lineHeight": "14px", "fontWeight": "500" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-surface-container-lowest text-on-surface font-body-base min-h-screen flex flex-col pt-16 pb-24">
<!-- TopAppBar -->
<header class="bg-surface-container-lowest text-primary font-headline-md docked full-width top-0 border-b border-outline-variant flat no shadows hover:bg-surface-container-low transition-colors active:opacity-80 transition-opacity flex items-center w-full px-margin-mobile md:px-margin-desktop h-16 fixed z-50 top-0 left-0">
<button class="mr-sm md:mr-md flex items-center justify-center p-sm rounded-full hover:bg-surface-container-highest transition-colors text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<span class="font-headline-md text-headline-md font-bold text-primary mr-auto">Certification Details&nbsp;</span>
</header>
<main class="flex-grow w-full max-w-3xl mx-auto px-margin-mobile md:px-margin-desktop py-xl">
<!-- Progress Header -->
<div class="mb-xl"><div class="flex justify-between items-end mb-sm">
<div>
<p class="font-mono-label text-mono-label text-on-surface-variant uppercase tracking-wider mb-xs">Step 7 of 9</p>
</div>
<div class="text-right">
<p class="font-mono-label text-mono-label text-primary font-bold">78%</p>
</div>
</div>
<div class="flex items-center gap-xs w-full">
<div class="h-1.5 flex-1 bg-primary rounded-full"></div>
<div class="h-1.5 flex-1 bg-primary rounded-full"></div>
<div class="h-1.5 flex-1 bg-primary rounded-full"></div>
<div class="h-1.5 flex-1 bg-primary rounded-full"></div>
<div class="h-1.5 flex-1 bg-primary rounded-full"></div>
<div class="h-1.5 flex-1 bg-primary rounded-full"></div>
<div class="h-1.5 flex-1 bg-primary rounded-full"></div>
<div class="h-1.5 flex-1 bg-surface-container-highest rounded-full"></div>
<div class="h-1.5 flex-1 bg-surface-container-highest rounded-full"></div>
</div>
<div class="mt-md">

<p class="font-body-base text-body-base text-on-surface-variant">Add certifications that validate your professional skills and achievements.</p>
</div></div>
<!-- Form -->
<form class="space-y-lg bg-surface-container-lowest">
<!-- Certification Name -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface mb-xs" for="cert-name">Certification Name <span class="text-error">*</span></label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-body-base text-body-base text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-shadow" id="cert-name" placeholder="Google Associate Android Developer" type="text">
</div>
<!-- Issuing Organization -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface mb-xs" for="org-name">Issuing Organization <span class="text-error">*</span></label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-body-base text-body-base text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-shadow" id="org-name" placeholder="Google" type="text">
</div>
<!-- Issue Date -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface mb-xs">Issue Date <span class="text-error">*</span></label>
<div class="grid grid-cols-2 gap-sm">
<div class="relative">
<select aria-label="Issue Month" class="w-full appearance-none bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-body-base text-body-base text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-shadow pr-lg">
<option disabled="" selected="" value="">Month</option>
<option>January</option>
<option>February</option>
<option>March</option>
<option>April</option>
<option>May</option>
<option>June</option>
<option>July</option>
<option>August</option>
<option>September</option>
<option>October</option>
<option>November</option>
<option>December</option>
</select>
<span class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none text-lg">expand_more</span>
</div>
<div class="relative">
<select aria-label="Issue Year" class="w-full appearance-none bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-body-base text-body-base text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-shadow pr-lg">
<option disabled="" selected="" value="">Year</option>
<option>2024</option>
<option>2023</option>
<option>2022</option>
<option>2021</option>
<option>2020</option>
</select>
<span class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none text-lg">expand_more</span>
</div>
</div>
</div>
<!-- Does Not Expire Toggle -->
<div class="flex items-center justify-between py-xs">
<label class="font-body-base text-body-base text-on-surface select-none cursor-pointer" for="no-expire-toggle">This credential does not expire</label>
<button aria-checked="false" class="relative inline-flex h-6 w-11 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-primary/20 bg-surface-container-highest" id="no-expire-toggle" onclick="toggleExpiration()" role="switch" type="button">
<span aria-hidden="true" class="pointer-events-none inline-block h-5 w-5 transform rounded-full bg-on-secondary shadow ring-0 transition duration-200 ease-in-out translate-x-0" id="toggle-knob"></span>
</button>
</div>
<!-- Expiration Date -->
<div class="transition-opacity duration-200" id="expiration-container">
<label class="block font-label-sm text-label-sm text-on-surface mb-xs">Expiration Date</label>
<div class="grid grid-cols-2 gap-sm">
<div class="relative">
<select aria-label="Expiration Month" class="w-full appearance-none bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-body-base text-body-base text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-shadow pr-lg disabled:opacity-50 disabled:bg-surface-container-low disabled:cursor-not-allowed" id="exp-month">
<option disabled="" selected="" value="">Month</option>
<option>January</option>
<option>February</option>
</select>
<span class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none text-lg opacity-50">expand_more</span>
</div>
<div class="relative">
<select aria-label="Expiration Year" class="w-full appearance-none bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-body-base text-body-base text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-shadow pr-lg disabled:opacity-50 disabled:bg-surface-container-low disabled:cursor-not-allowed" id="exp-year">
<option disabled="" selected="" value="">Year</option>
<option>2025</option>
<option>2026</option>
</select>
<span class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none text-lg opacity-50">expand_more</span>
</div>
</div>
</div>
<!-- Credential ID -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface mb-xs" for="cred-id">Credential ID</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-body-base text-body-base text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-shadow font-mono-label tracking-wide" id="cred-id" placeholder="ABCD-1234-XYZ" type="text">
</div>
<!-- Credential URL -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface mb-xs" for="cred-url">Credential URL</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-body-base text-body-base text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-shadow" id="cred-url" placeholder="https://www.credly.com/..." type="url">
</div>
<!-- Description -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface mb-xs" for="cert-desc">Description</label>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-body-base text-body-base text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-shadow resize-y" id="cert-desc" maxlength="500" placeholder="Briefly describe what this certification demonstrates or the skills gained." rows="4"></textarea>
<div class="text-right mt-xs">
<span class="font-label-sm text-label-sm text-on-surface-variant">0 / 500</span>
</div>
</div>
</form>
</main>
<!-- Footer -->
<footer class="bg-surface-container-lowest text-primary font-label-sm fixed bottom-0 w-full border-t border-outline-variant flat no shadows hover:brightness-95 transition-all active:scale-95 duration-100 fixed bottom-0 left-0 w-full z-50 flex justify-end gap-md p-md bg-surface-container-lowest">
<button class="text-secondary-container border border-outline-variant rounded-xl px-lg py-sm text-on-surface hover:bg-surface-container-low transition-colors font-label-sm text-label-sm font-medium">Cancel</button>
<button class="bg-primary text-on-primary rounded-xl px-lg py-sm font-bold font-label-sm text-label-sm hover:bg-on-primary-fixed-variant transition-colors shadow-sm">Save Certification</button>
</footer>
<script>
        function toggleExpiration() {
            const toggleBtn = document.getElementById('no-expire-toggle');
            const toggleKnob = document.getElementById('toggle-knob');
            const expMonth = document.getElementById('exp-month');
            const expYear = document.getElementById('exp-year');
            const expContainer = document.getElementById('expiration-container');
            
            const isChecked = toggleBtn.getAttribute('aria-checked') === 'true';
            
            if (isChecked) {
                // Turn off
                toggleBtn.setAttribute('aria-checked', 'false');
                toggleBtn.classList.remove('bg-primary');
                toggleBtn.classList.add('bg-surface-container-highest');
                toggleKnob.classList.remove('translate-x-5');
                toggleKnob.classList.add('translate-x-0');
                
                expMonth.disabled = false;
                expYear.disabled = false;
                expContainer.classList.remove('opacity-50');
            } else {
                // Turn on
                toggleBtn.setAttribute('aria-checked', 'true');
                toggleBtn.classList.remove('bg-surface-container-highest');
                toggleBtn.classList.add('bg-primary');
                toggleKnob.classList.remove('translate-x-0');
                toggleKnob.classList.add('translate-x-5');
                
                expMonth.disabled = true;
                expYear.disabled = true;
                expContainer.classList.add('opacity-50');
            }
        }
    </script>




</body></html>
