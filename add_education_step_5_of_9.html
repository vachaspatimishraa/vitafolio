<style>
        body { font-family: 'Inter', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

            background-color: #E5E7EB;

<body class="bg-background text-on-background antialiased flex flex-col min-h-screen">
<!-- TopAppBar -->
<header class="w-full sticky top-0 z-50 bg-surface dark:bg-background border-b border-outline-variant dark:border-outline flex justify-between items-center px-margin-mobile h-16">
<button class="text-primary dark:text-inverse-primary hover:bg-surface-container-low transition-colors active:scale-95 duration-150 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: &quot;FILL&quot; 0;">arrow_back</span>
</button>
<h1 class="text-primary dark:text-inverse-primary font-headline-md text-headline-md font-bold">Education Details</h1>
<button class="text-primary dark:text-inverse-primary hover:bg-surface-container-low transition-colors active:scale-95 duration-150 p-2 rounded-full flex items-center justify-center">

</button>
</header>
<!-- Main Content Area -->
<main class="flex-grow flex flex-col w-full max-w-3xl mx-auto pb-32">
<!-- NavigationDrawer / Progress Indicator Placeholder Image Match -->
<div class="w-full px-margin-mobile py-lg border-b border-outline-variant bg-surface-container-lowest"><div class="flex justify-between items-end mb-md">
<span class="font-label-sm text-label-sm text-on-surface-variant font-bold tracking-wider">STEP 5 OF 9</span>
<span class="font-label-sm text-label-sm text-primary-container font-medium">55% Completed</span>
</div>
<div class="flex items-center w-full gap-xs">
<!-- Segment 1: Completed -->
<div class="flex-1 h-2 rounded-full bg-primary-container"></div>
<!-- Segment 2: Completed -->
<div class="flex-1 h-2 rounded-full bg-primary-container"></div>
<!-- Segment 3: Completed -->
<div class="flex-1 h-2 rounded-full bg-primary-container"></div>
<!-- Segment 4: Completed -->
<div class="flex-1 h-2 rounded-full bg-primary-container"></div>
<!-- Segment 5: Active -->
<div class="flex-1 h-2 rounded-full bg-primary-container"></div>
<!-- Segment 6: Pending -->
<div class="flex-1 h-2 rounded-full bg-surface-container-highest"></div>
<!-- Segment 7: Pending -->
<div class="flex-1 h-2 rounded-full bg-surface-container-highest"></div>
<!-- Segment 8: Pending -->
<div class="flex-1 h-2 rounded-full bg-surface-container-highest"></div>
<!-- Segment 9: Pending -->
<div class="flex-1 h-2 rounded-full bg-surface-container-highest"></div>
</div></div>
<!-- Page Header -->
<div class="px-margin-mobile pt-lg pb-md">

<p class="text-[15px] leading-relaxed text-[#6B7280]">Tell employers about your educational qualifications. List your highest qualification first.</p>
</div>
<!-- Form Area -->
<form class="px-margin-mobile space-y-md">
<!-- Education Level -->
<div class="flex flex-col gap-sm">
<label class="font-label-sm text-label-sm text-on-background font-medium" for="education_level">Education Level <span class="text-error">*</span></label>
<div class="relative">
<select class="w-full bg-surface-container-lowest border border-[#E5E7EB] rounded-lg px-md py-3 font-body-base text-body-base text-on-background focus:border-primary-container focus:ring-2 focus:ring-primary-container/10 appearance-none transition-shadow outline-none" id="education_level">
<option disabled="" selected="" value="">Select Level</option>
<option value="ssc">SSC</option>
<option value="hsc">HSC</option>
<option value="diploma">Diploma</option>
<option value="graduation">Graduation</option>
<option value="post_graduation">Post Graduation</option>
<option value="doctorate">Doctorate</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-md text-on-surface-variant">
<span class="material-symbols-outlined" style="font-variation-settings: &quot;FILL&quot; 0;">expand_more</span>
</div>
</div>
</div>
<!-- Degree / Course -->
<div class="flex flex-col gap-sm">
<label class="font-label-sm text-label-sm text-on-background font-medium" for="degree">Degree / Course <span class="text-error">*</span></label>
<input class="w-full bg-surface-container-lowest border border-[#E5E7EB] rounded-lg px-md py-3 font-body-base text-body-base text-on-background placeholder:text-outline focus:border-primary-container focus:ring-2 focus:ring-primary-container/10 transition-shadow outline-none" id="degree" placeholder="Bachelor of Technology" type="text">
</div>
<!-- Field of Study -->
<div class="flex flex-col gap-sm">
<label class="font-label-sm text-label-sm text-on-background font-medium" for="field_of_study">Field of Study</label>
<input class="w-full bg-surface-container-lowest border border-[#E5E7EB] rounded-lg px-md py-3 font-body-base text-body-base text-on-background placeholder:text-outline focus:border-primary-container focus:ring-2 focus:ring-primary-container/10 transition-shadow outline-none" id="field_of_study" placeholder="Computer Science &amp; Engineering" type="text">
</div>
<!-- Institution / School Name -->
<div class="flex flex-col gap-sm">
<label class="font-label-sm text-label-sm text-on-background font-medium" for="institution">Institution / School Name <span class="text-error">*</span></label>
<input class="w-full bg-surface-container-lowest border border-[#E5E7EB] rounded-lg px-md py-3 font-body-base text-body-base text-on-background placeholder:text-outline focus:border-primary-container focus:ring-2 focus:ring-primary-container/10 transition-shadow outline-none" id="institution" placeholder="ABC University" type="text">
</div>
<!-- City & State Row -->
<div class="grid grid-cols-2 gap-md">
<div class="flex flex-col gap-sm">
<label class="font-label-sm text-label-sm text-on-background font-medium" for="city">City</label>
<input class="w-full bg-surface-container-lowest border border-[#E5E7EB] rounded-lg px-md py-3 font-body-base text-body-base text-on-background placeholder:text-outline focus:border-primary-container focus:ring-2 focus:ring-primary-container/10 transition-shadow outline-none" id="city" placeholder="New York" type="text">
</div>
<div class="flex flex-col gap-sm">
<label class="font-label-sm text-label-sm text-on-background font-medium" for="state">State</label>
<input class="w-full bg-surface-container-lowest border border-[#E5E7EB] rounded-lg px-md py-3 font-body-base text-body-base text-on-background placeholder:text-outline focus:border-primary-container focus:ring-2 focus:ring-primary-container/10 transition-shadow outline-none" id="state" placeholder="NY" type="text">
</div>
</div>
<!-- Start Year & Passing Year Row -->
<div class="grid grid-cols-2 gap-md">
<div class="flex flex-col gap-sm">
<label class="font-label-sm text-label-sm text-on-background font-medium" for="start_year">Start Year</label>
<div class="relative">
<select class="w-full bg-surface-container-lowest border border-[#E5E7EB] rounded-lg px-md py-3 font-body-base text-body-base text-on-background focus:border-primary-container focus:ring-2 focus:ring-primary-container/10 appearance-none transition-shadow outline-none" id="start_year">
<option disabled="" selected="" value="">YYYY</option>
<option value="2023">2023</option>
<option value="2022">2022</option>
<option value="2021">2021</option>
<option value="2020">2020</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-md text-on-surface-variant">
<span class="material-symbols-outlined" style="font-variation-settings: &quot;FILL&quot; 0;">calendar_today</span>
</div>
</div>
</div>
<div class="flex flex-col gap-sm">
<label class="font-label-sm text-label-sm text-on-background font-medium" for="passing_year">Passing Year <span class="text-error">*</span></label>
<div class="relative">
<select class="w-full bg-surface-container-lowest border border-[#E5E7EB] rounded-lg px-md py-3 font-body-base text-body-base text-on-background focus:border-primary-container focus:ring-2 focus:ring-primary-container/10 appearance-none transition-shadow outline-none" id="passing_year">
<option disabled="" selected="" value="">YYYY</option>
<option value="2024">2024</option>
<option value="2023">2023</option>
<option value="2022">2022</option>
<option value="2021">2021</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-md text-on-surface-variant">
<span class="material-symbols-outlined" style="font-variation-settings: &quot;FILL&quot; 0;">calendar_today</span>
</div>
</div>
</div>
</div>
<!-- Grade / Percentage / CGPA -->
<div class="flex flex-col gap-sm">
<label class="font-label-sm text-label-sm text-on-background font-medium" for="grade">Grade / Percentage / CGPA</label>
<input class="w-full bg-surface-container-lowest border border-[#E5E7EB] rounded-lg px-md py-3 font-body-base text-body-base text-on-background placeholder:text-outline focus:border-primary-container focus:ring-2 focus:ring-primary-container/10 transition-shadow outline-none" id="grade" placeholder="8.75 CGPA" type="text">
</div>
<!-- Description -->
<div class="flex flex-col gap-sm">
<label class="font-label-sm text-label-sm text-on-background font-medium flex justify-between" for="description">
<span class="">Description (Optional)</span>
</label>
<textarea class="w-full bg-surface-container-lowest border border-[#E5E7EB] rounded-lg px-md py-3 font-body-base text-body-base text-on-background placeholder:text-outline focus:border-primary-container focus:ring-2 focus:ring-primary-container/10 transition-shadow outline-none resize-none" id="description" placeholder="Mention your achievements, projects, relevant coursework, etc." rows="4"></textarea>
<!-- Quick Suggestions -->
<div class="mt-2">
<p class="font-label-sm text-label-sm text-on-surface-variant mb-2">Quick Suggestions:</p>
<div class="flex flex-wrap gap-2">
<button class="bg-[#F3F4F6] text-[#374151] font-label-sm text-label-sm px-3 py-1.5 rounded-full hover:bg-[#E5E7EB] transition-colors border border-transparent" type="button">+ Dean's List</button>
<button class="bg-[#F3F4F6] text-[#374151] font-label-sm text-label-sm px-3 py-1.5 rounded-full hover:bg-[#E5E7EB] transition-colors border border-transparent" type="button">+ First Class</button>
<button class="bg-[#F3F4F6] text-[#374151] font-label-sm text-label-sm px-3 py-1.5 rounded-full hover:bg-[#E5E7EB] transition-colors border border-transparent" type="button">+ Distinction</button>
<button class="bg-[#F3F4F6] text-[#374151] font-label-sm text-label-sm px-3 py-1.5 rounded-full hover:bg-[#E5E7EB] transition-colors border border-transparent" type="button">+ Gold Medal</button>
<button class="bg-[#F3F4F6] text-[#374151] font-label-sm text-label-sm px-3 py-1.5 rounded-full hover:bg-[#E5E7EB] transition-colors border border-transparent" type="button">+ Scholarship Holder</button>
<button class="bg-[#F3F4F6] text-[#374151] font-label-sm text-label-sm px-3 py-1.5 rounded-full hover:bg-[#E5E7EB] transition-colors border border-transparent" type="button">+ Research Project</button>
</div>
</div>
</div>
<div class="h-8"></div> <!-- Spacer for scrolling past footer -->
</form>
</main>
<!-- Sticky Footer -->
<footer class="fixed bottom-0 w-full z-50 bg-surface-container-lowest border-t border-outline-variant px-margin-mobile py-md">
<div class="max-w-3xl mx-auto flex gap-md">
<button class="flex-1 bg-surface-container-lowest border border-[#E5E7EB] text-[#111827] font-body-base text-body-base font-semibold h-[54px] rounded-[14px] flex items-center justify-center hover:bg-surface-container-low transition-colors active:scale-95" type="button">
                Cancel
            </button>
<button class="flex-[2] bg-primary-container text-on-primary font-body-base text-body-base font-semibold h-[54px] rounded-[14px] flex items-center justify-center hover:bg-on-primary-fixed-variant transition-colors active:scale-95 shadow-sm" type="button">
                Save Education
            </button>
</div>
</footer>
<script>
        // Simple script to append suggestion text to textarea
        document.addEventListener('DOMContentLoaded', () => {
            const descriptionArea = document.getElementById('description');
            const suggestionButtons = document.querySelectorAll('button:not([type="submit"])');
            
            suggestionButtons.forEach(btn => {
                if(btn.textContent.startsWith('+')) {
                    btn.addEventListener('click', () => {
                        const textToAdd = btn.textContent.replace('+ ', '');
                        if (descriptionArea.value) {
                            descriptionArea.value += `\n• ${textToAdd}`;
                        } else {
                            descriptionArea.value = `• ${textToAdd}`;
                        }
                    });
                }
            });
        });
    </script>


</body></html>
