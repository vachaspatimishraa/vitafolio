<style>
        .animate-logo {
            animation: fadeInScale 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: scale(0.9);
        }
        
        .animate-title {
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
            opacity: 0;
        }

        .animate-tagline {
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
            opacity: 0;
        }
        
        .animate-progress-container {
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.8s forwards;
            opacity: 0;
        }

        .progress-bar {
            width: 0%;
            animation: progress 2s cubic-bezier(0.65, 0, 0.35, 1) 0.8s infinite;
        }

        @keyframes fadeInScale {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        @keyframes progress {
            0% { width: 0%; transform: translateX(-100%); }
            50% { width: 40%; transform: translateX(50%); }
            100% { width: 100%; transform: translateX(100%); }
        }
    </style>
