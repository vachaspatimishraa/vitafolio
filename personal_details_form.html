<!DOCTYPE html><html class="light" lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Vitafolio - Personal Details</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "primary-fixed": "#dbe1ff",
                    "on-tertiary-container": "#eaf0ff",
                    "inverse-on-surface": "#f0f1f2",
                    "on-tertiary-fixed-variant": "#404754",
                    "on-tertiary": "#ffffff",
                    "on-surface-variant": "#434655",
                    "on-primary-fixed": "#00174b",
                    "outline": "#737686",
                    "tertiary": "#4e5562",
                    "on-secondary-fixed": "#141b2b",
                    "primary-container": "#2563eb",
                    "on-error": "#ffffff",
                    "surface-container-lowest": "#ffffff",
                    "error-container": "#ffdad6",
                    "secondary-fixed-dim": "#c0c6db",
                    "surface-container": "#edeeef",
                    "background": "#f8f9fa",
                    "on-secondary": "#ffffff",
                    "on-background": "#191c1d",
                    "secondary-fixed": "#dce2f7",
                    "surface-tint": "#0053db",
                    "primary": "#004ac6",
                    "surface-bright": "#f8f9fa",
                    "tertiary-fixed": "#dce2f3",
                    "on-primary-container": "#eeefff",
                    "tertiary-fixed-dim": "#c0c7d6",
                    "primary-fixed-dim": "#b4c5ff",
                    "secondary-container": "#d9dff5",
                    "tertiary-container": "#666d7b",
                    "inverse-primary": "#b4c5ff",
                    "surface": "#f8f9fa",
                    "outline-variant": "#c3c6d7",
                    "surface-container-highest": "#e1e3e4",
                    "on-error-container": "#93000a",
                    "on-primary": "#ffffff",
                    "surface-container-low": "#f3f4f5",
                    "on-tertiary-fixed": "#151c27",
                    "surface-dim": "#d9dadb",
                    "on-secondary-fixed-variant": "#404758",
                    "secondary": "#575e70",
                    "inverse-surface": "#2e3132",
                    "surface-container-high": "#e7e8e9",
                    "surface-variant": "#e1e3e4",
                    "on-primary-fixed-variant": "#003ea8",
                    "error": "#ba1a1a",
                    "on-surface": "#191c1d",
                    "on-secondary-container": "#5c6274"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem",
                    "14": "14px"
            },
            "spacing": {
                    "md": "16px",
                    "margin-mobile": "16px",
                    "sm": "8px",
                    "unit": "4px",
                    "margin-desktop": "48px",
                    "xs": "4px",
                    "lg": "24px",
                    "gutter": "16px",
                    "xl": "32px",
                    "56": "56px"
            },
            "fontFamily": {
                    "display-lg-mobile": ["Inter"],
                    "headline-md": ["Inter"],
                    "mono-label": ["jetbrainsMono"],
                    "body-base": ["Inter"],
                    "label-sm": ["Inter"],
                    "tagline": ["Inter"],
                    "display-lg": ["Inter"]
            },
            "fontSize": {
                    "display-lg-mobile": ["26px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                    "headline-md": ["20px", {"lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "mono-label": ["11px", {"lineHeight": "14px", "fontWeight": "500"}],
                    "body-base": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "500"}],
                    "tagline": ["16px", {"lineHeight": "24px", "fontWeight": "500"}],
                    "display-lg": ["30px", {"lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700"}]

          }
        }
      }

<style>
        .custom-input {
            height: 56px;
            border-radius: 14px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background antialiased min-h-screen flex flex-col font-sans relative pb-24">
<!-- Top AppBar (Linear/Transactional - Modified for Context) -->
<header class="bg-surface w-full top-0 sticky z-50 border-b border-outline-variant flex justify-between items-center px-margin-mobile h-16 w-full max-w-screen-xl mx-auto">
<button aria-label="Go back" class="flex items-center justify-center p-2 rounded-full hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface">Personal Details&nbsp;</h1>
<div class="w-10"></div> <!-- Spacer for balance -->
</header>
<main class="flex-grow w-full max-w-lg mx-auto px-margin-mobile pt-lg pb-xl flex flex-col gap-xl">
<!-- Progress Stepper -->
<div class="flex flex-col gap-sm"><div class="flex justify-between items-center text-label-sm font-label-sm">
  <span class="text-on-surface-variant font-medium">Step 2 of 9</span>
  <span class="text-primary-container font-semibold">22%</span>
</div>
<div class="flex gap-unit h-2 w-full">
  <div class="h-full bg-primary-container rounded-full flex-1"></div>
  <div class="h-full bg-primary-container rounded-full flex-1"></div>
  <div class="h-full bg-surface-variant rounded-full flex-1"></div>
  <div class="h-full bg-surface-variant rounded-full flex-1"></div>
  <div class="h-full bg-surface-variant rounded-full flex-1"></div>
  <div class="h-full bg-surface-variant rounded-full flex-1"></div>
  <div class="h-full bg-surface-variant rounded-full flex-1"></div>
  <div class="h-full bg-surface-variant rounded-full flex-1"></div>
  <div class="h-full bg-surface-variant rounded-full flex-1"></div>
</div></div>
<!-- Header -->
<div>

<p class="font-body-base text-body-base text-outline">Tell us about yourself...</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-lg">
<!-- Profile Photo -->
<div class="flex flex-col items-center gap-md">
<div class="relative w-24 h-24 rounded-full bg-surface-container-high border border-outline-variant flex items-center justify-center cursor-pointer hover:bg-surface-container-highest transition-colors">
<span class="material-symbols-outlined text-3xl text-outline">person</span>
<button class="absolute bottom-0 right-0 bg-primary-container text-on-primary-container rounded-full p-1.5 shadow-sm border-2 border-surface" type="button">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: &quot;FILL&quot; 1;">photo_camera</span>
</button>
</div>
<span class="font-label-sm text-label-sm text-primary-container cursor-pointer font-medium hover:underline">Upload Photo</span>
</div>
<div class="flex flex-col gap-md">
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1">Full Name *</label>
<input class="custom-input bg-surface border-outline-variant text-on-surface focus:border-primary-container focus:ring-2 focus:ring-primary-container/10 px-md w-full placeholder-outline transition-all" placeholder="John Doe" required="" type="text">
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1">Job Role *</label>
<input class="custom-input bg-surface border-outline-variant text-on-surface focus:border-primary-container focus:ring-2 focus:ring-primary-container/10 px-md w-full placeholder-outline transition-all" placeholder="e.g. Senior Product Designer" required="" type="text">
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1">Phone Number</label>
<input class="custom-input bg-surface border-outline-variant text-on-surface focus:border-primary-container focus:ring-2 focus:ring-primary-container/10 px-md w-full placeholder-outline transition-all" placeholder="+1 (555) 000-0000" type="tel">
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1">Email Address *</label>
<input class="custom-input bg-surface border-outline-variant text-on-surface focus:border-primary-container focus:ring-2 focus:ring-primary-container/10 px-md w-full placeholder-outline transition-all" placeholder="john@example.com" required="" type="email">
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1">Location</label>
<div class="relative">
<select class="custom-input appearance-none bg-surface border-outline-variant text-on-surface focus:border-primary-container focus:ring-2 focus:ring-primary-container/10 px-md w-full transition-all">
<option disabled="" selected="" value="">Select City &amp; State</option>
<option value="ny">New York, NY</option>
<option value="sf">San Francisco, CA</option>
<option value="tx">Austin, TX</option>
<option value="other">Other...</option>
</select>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-outline pointer-events-none">expand_more</span>
</div>
</div>
</div>
<!-- Social Links -->
<div class="flex flex-col gap-md pt-md border-t border-surface-variant">
<h3 class="font-headline-md text-sm text-on-surface">Professional Links <span class="text-outline font-normal text-xs ml-1">(Optional)</span></h3>
<div class="flex flex-col gap-sm">
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline">link</span>
<input class="custom-input bg-surface border-outline-variant text-on-surface focus:border-primary-container focus:ring-2 focus:ring-primary-container/10 pl-[48px] pr-md w-full placeholder-outline transition-all" placeholder="LinkedIn URL" type="url">
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline">code</span>
<input class="custom-input bg-surface border-outline-variant text-on-surface focus:border-primary-container focus:ring-2 focus:ring-primary-container/10 pl-[48px] pr-md w-full placeholder-outline transition-all" placeholder="GitHub URL" type="url">
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline">language</span>
<input class="custom-input bg-surface border-outline-variant text-on-surface focus:border-primary-container focus:ring-2 focus:ring-primary-container/10 pl-[48px] pr-md w-full placeholder-outline transition-all" placeholder="Personal Portfolio URL" type="url">
</div>
</div>
</div>
</form>
</main>
<!-- Fixed Bottom Action Bar -->
<div class="fixed bottom-0 left-0 w-full bg-surface border-t border-outline-variant p-margin-mobile z-40 pb-safe">
<div class="max-w-lg mx-auto flex gap-md">
<button class="flex-1 h-56 rounded-14 border border-outline-variant bg-surface text-on-surface font-label-sm text-sm font-semibold hover:bg-surface-container transition-colors flex items-center justify-center">
                Previous
            </button>
<button class="flex-1 h-56 rounded-14 bg-primary-container text-on-primary-container font-label-sm text-sm font-semibold hover:opacity-90 transition-opacity flex items-center justify-center shadow-sm">
                Continue
            </button>
</div>
</div>




</body></html>
