<!DOCTYPE html><html lang="en" style="width: 390px; height: 1540px; overflow: hidden; position: relative;"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Vitafolio - Add Experience</title>

                        "on-background": "#191c1d",

                        "tertiary": "#4e5562",

                }
            }
        }

<style>
        .stagger-1 { animation: slideUp 0.4s ease-out 0.1s both; }
        .stagger-2 { animation: slideUp 0.4s ease-out 0.2s both; }
        .stagger-3 { animation: slideUp 0.4s ease-out 0.3s both; }
        .stagger-4 { animation: slideUp 0.4s ease-out 0.4s both; }
        .stagger-5 { animation: slideUp 0.4s ease-out 0.5s both; }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-field {
            @apply w-full bg-surface-container-lowest border border-surface-variant rounded-[14px] px-4 py-3 text-body-base text-on-surface focus:outline-none focus:ring-2 focus:ring-primary-container/20 focus:border-primary-container transition-all;
        }

        .input-label {
            @apply block font-label-sm text-label-sm text-on-surface-variant mb-2;
        }

        /* Hide scrollbar for nav drawer */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-base antialiased">
<!-- TopAppBar -->
<header class="w-full sticky top-0 z-50 bg-surface dark:bg-background border-b border-outline-variant dark:border-outline flex justify-between items-center px-margin-mobile h-16">
<button class="text-on-surface-variant hover:bg-surface-container-low transition-colors active:scale-95 duration-150 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="text-headline-md-mobile md:text-headline-md font-headline-md text-primary dark:text-inverse-primary">Work Experience&nbsp;</h1>
<button class="text-on-surface-variant hover:bg-surface-container-low transition-colors active:scale-95 duration-150 p-2 rounded-full flex items-center justify-center">

</button>
</header>
<!-- NavigationDrawer (Progress Stepper) -->
<nav class="w-full overflow-x-auto whitespace-nowrap bg-surface-container-low dark:bg-surface-container-lowest border-b border-outline-variant flex items-center px-margin-mobile no-scrollbar"><div class="w-full max-w-3xl mx-auto flex flex-col py-4">
  <div class="flex justify-between items-center mb-2">
    <span class="text-on-surface-variant text-sm font-medium uppercase tracking-wider">Step 4 of 9</span>
    <span class="text-[#2563EB] text-sm font-bold">44% Completed</span>
  </div>
  <div class="flex items-center gap-2">
    <div class="flex-1 h-2.5 bg-[#2563EB] rounded-full"></div>
    <div class="flex-1 h-2.5 bg-[#2563EB] rounded-full"></div>
    <div class="flex-1 h-2.5 bg-[#2563EB] rounded-full"></div>
    <div class="flex-1 h-2.5 bg-[#2563EB] rounded-full"></div>
    <div class="flex-1 h-2.5 bg-outline-variant/30 rounded-full"></div>
    <div class="flex-1 h-2.5 bg-outline-variant/30 rounded-full"></div>
    <div class="flex-1 h-2.5 bg-outline-variant/30 rounded-full"></div>
    <div class="flex-1 h-2.5 bg-outline-variant/30 rounded-full"></div>
    <div class="flex-1 h-2.5 bg-outline-variant/30 rounded-full"></div>
  </div>
</div></nav>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-3xl mx-auto px-margin-mobile py-xl pb-32">
<header class="mb-xl stagger-1">

<p class="text-[15px] leading-6 text-on-surface-variant">Tell employers where you've worked and what you've accomplished.</p>
</header>
<form class="space-y-lg">
<!-- Grid Row 1 -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-lg stagger-2">
<div>
<label class="input-label" for="jobTitle">Job Title *</label>
<input class="input-field" id="jobTitle" placeholder="e.g. Senior Product Designer" required="" type="text">
</div>
<div>
<label class="input-label" for="companyName">Company Name *</label>
<input class="input-field" id="companyName" placeholder="e.g. Acme Corp" required="" type="text">
</div>
</div>
<!-- Grid Row 2 -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-lg stagger-3">
<div>
<label class="input-label" for="employmentType">Employment Type</label>
<div class="relative">
<select class="input-field appearance-none pr-10 cursor-pointer" id="employmentType">
<option value="">Select type...</option>
<option value="full-time">Full-time</option>
<option value="part-time">Part-time</option>
<option value="contract">Contract</option>
<option value="freelance">Freelance</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
<div>
<label class="input-label" for="location">Location</label>
<input class="input-field" id="location" placeholder="e.g. San Francisco, CA" type="text">
</div>
</div>
<!-- Work Mode Segmented Control -->
<div class="stagger-3">
<label class="input-label mb-2">Work Mode</label>
<div class="flex bg-surface-container-low p-1 rounded-[14px] border border-surface-variant">
<button class="flex-1 py-2 text-sm font-medium text-on-surface bg-surface-container-lowest shadow-sm rounded-xl border border-surface-variant/50 transition-all" type="button">On-site</button>
<button class="flex-1 py-2 text-sm font-medium text-on-surface-variant hover:text-on-surface transition-all rounded-xl" type="button">Hybrid</button>
<button class="flex-1 py-2 text-sm font-medium text-on-surface-variant hover:text-on-surface transition-all rounded-xl" type="button">Remote</button>
</div>
</div>
<!-- Date Row -->
<div class="bg-surface-container-lowest border border-surface-variant rounded-[14px] p-lg stagger-4">
<div class="flex items-center justify-between mb-md">
<label class="font-label-sm text-label-sm text-on-surface font-semibold">Time Period</label>
<div class="flex items-center space-x-2">
<span class="text-sm text-on-surface-variant">Currently Working Here</span>
<button class="w-10 h-6 bg-primary-container rounded-full relative transition-colors" type="button">
<span class="absolute right-1 top-1 w-4 h-4 bg-white rounded-full shadow-sm transition-transform"></span>
</button>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-lg">
<div>
<label class="input-label">From Date</label>
<div class="grid grid-cols-2 gap-2">
<select class="input-field appearance-none cursor-pointer"><option>Month</option></select>
<select class="input-field appearance-none cursor-pointer"><option>Year</option></select>
</div>
</div>
<div>
<label class="input-label text-on-surface-variant/50">To Date</label>
<div class="grid grid-cols-2 gap-2 opacity-50 pointer-events-none">
<select class="input-field appearance-none"><option>Present</option></select>
<select class="input-field appearance-none"><option>Present</option></select>
</div>
</div>
</div>
</div>
<!-- Editor -->
<div class="stagger-5">
<div class="flex justify-between mb-2">
<label class="input-label mb-0" for="responsibilities">Responsibilities &amp; Achievements</label>
<span class="text-xs text-on-surface-variant">0 / 1200</span>
</div>
<div class="border border-surface-variant rounded-[14px] bg-surface-container-lowest overflow-hidden focus-within:ring-2 focus-within:ring-primary-container/20 focus-within:border-primary-container transition-all">
<!-- Toolbar mockup -->
<div class="flex items-center border-b border-surface-variant p-2 space-x-1 bg-surface-bright">
<button class="p-1.5 text-on-surface-variant hover:bg-surface-container-low rounded" type="button"><span class="material-symbols-outlined text-[18px]">format_bold</span></button>
<button class="p-1.5 text-on-surface-variant hover:bg-surface-container-low rounded" type="button"><span class="material-symbols-outlined text-[18px]">format_italic</span></button>
<div class="w-px h-4 bg-outline-variant mx-1"></div>
<button class="p-1.5 text-on-surface-variant hover:bg-surface-container-low rounded" type="button"><span class="material-symbols-outlined text-[18px]">format_list_bulleted</span></button>
<button class="p-1.5 text-on-surface-variant hover:bg-surface-container-low rounded" type="button"><span class="material-symbols-outlined text-[18px]">format_list_numbered</span></button>
</div>
<textarea class="w-full p-4 h-48 resize-y focus:outline-none bg-transparent text-body-base" id="responsibilities" placeholder="Describe your key responsibilities and measurable achievements..."></textarea>
</div>
<!-- Quick Suggestions -->
<div class="mt-4">
<span class="text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-2 block">Quick Suggestions</span>
<div class="flex flex-wrap gap-2">
<button class="px-3 py-1.5 bg-surface-container-low hover:bg-surface-container text-on-surface text-sm rounded-full border border-surface-variant transition-colors flex items-center space-x-1" type="button">
<span class="material-symbols-outlined text-[14px]">add</span>
<span class="">Improved performance</span>
</button>
<button class="px-3 py-1.5 bg-surface-container-low hover:bg-surface-container text-on-surface text-sm rounded-full border border-surface-variant transition-colors flex items-center space-x-1" type="button">
<span class="material-symbols-outlined text-[14px]">add</span>
<span class="">Led a team</span>
</button>
<button class="px-3 py-1.5 bg-surface-container-low hover:bg-surface-container text-on-surface text-sm rounded-full border border-surface-variant transition-colors flex items-center space-x-1" type="button">
<span class="material-symbols-outlined text-[14px]">add</span>
<span class="">Increased revenue</span>
</button>
</div>
</div>
</div>
</form>
</main>
<!-- BottomNavBar (Transactional Context, acting as Actions) -->
<div class="fixed bottom-0 w-full z-50 bg-surface dark:bg-background border-t border-outline-variant dark:border-outline flex justify-between items-center px-margin-mobile py-md w-full shadow-[0_-4px_20px_rgba(0,0,0,0.05)]">
<div class="w-full max-w-3xl mx-auto flex justify-between items-center space-x-4">
<button class="flex-1 md:flex-none px-6 py-3 border border-outline-variant text-on-surface font-semibold rounded-[14px] hover:bg-surface-container-low transition-colors text-sm">
                Cancel
            </button>
<button class="flex-1 md:flex-none px-6 py-3 bg-[#2563EB] text-white font-semibold rounded-[14px] hover:bg-blue-700 transition-colors shadow-sm text-sm">
                Save Experience
            </button>
</div>
</div>
