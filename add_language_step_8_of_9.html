<body class="bg-surface-container-lowest min-h-screen flex flex-col relative pb-24">
<!-- TOP APP BAR -->
<header class="w-full sticky top-0 z-50 border-b border-outline-variant bg-surface-container-lowest flex justify-between items-center px-margin-mobile md:px-margin-desktop h-16 w-full">
<button class="flex items-center justify-center p-2 rounded-full hover:bg-surface-container-low transition-colors text-on-surface-variant">

</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary">Add Language</h1>
<div class="w-10"></div> <!-- Placeholder for balance -->
</header>
<!-- MAIN CONTENT -->
<main class="flex-1 w-full max-w-3xl mx-auto px-margin-mobile md:px-0 pt-md pb-xl">
<!-- STEPPER PROGRESS -->
<section class="mb-xl"><div class="flex justify-between items-end mb-sm"><span class="font-label-sm text-label-sm text-on-surface-variant tracking-wider uppercase">STEP 8 OF 9</span><span class="font-label-sm text-label-sm text-primary font-semibold">89% Completed</span></div><div class="flex gap-xs"><div class="h-1.5 flex-1 bg-primary rounded-full"></div><div class="h-1.5 flex-1 bg-primary rounded-full"></div><div class="h-1.5 flex-1 bg-primary rounded-full"></div><div class="h-1.5 flex-1 bg-primary rounded-full"></div><div class="h-1.5 flex-1 bg-primary rounded-full"></div><div class="h-1.5 flex-1 bg-primary rounded-full"></div><div class="h-1.5 flex-1 bg-primary rounded-full"></div><div class="h-1.5 flex-1 bg-primary rounded-full"></div><div class="h-1.5 flex-1 bg-surface-container-highest rounded-full"></div></div></section>

<header class="mb-xl pt-md">
<h2 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-on-surface mb-sm">Language Details</h2>
<p class="font-body-base text-body-base text-on-surface-variant">Add languages you know and specify your proficiency level.</p>
</header>
<!-- FORM & PREVIEW BENTO LAYOUT -->
<div class="grid grid-cols-1 md:grid-cols-12 gap-xl">
<!-- FORM COLUMN -->
<div class="md:col-span-7 flex flex-col gap-md">
<!-- Language Dropdown -->
<div class="relative group">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-xs">Language *</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]">translate</span>
</div>
<input class="w-full pl-12 pr-10 py-3 bg-surface-container-lowest border border-outline-variant rounded-xl font-body-base text-body-base text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-shadow" placeholder="Select or type a language" type="text" value="English">
<div class="absolute inset-y-0 right-0 pr-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]">expand_more</span>
</div>
</div>
</div>
<!-- Proficiency Dropdown -->
<div class="relative group mt-sm">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-xs">Proficiency Level *</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]">bar_chart</span>
</div>
<div class="w-full pl-12 pr-10 py-3 bg-surface-container-lowest border border-outline-variant rounded-xl font-body-base text-body-base text-on-surface flex justify-between items-center cursor-pointer hover:border-outline transition-colors">
<span>Professional Working Proficiency</span>
<span class="material-symbols-outlined text-outline text-[20px]">expand_more</span>
</div>
</div>
</div>
</div>

<label class="block font-label-sm text-label-sm text-on-surface-variant mb-xs">Live Preview</label>
<div class="bg-surface-container-lowest border border-outline-variant rounded-2xl p-lg flex flex-col gap-sm shadow-sm relative overflow-hidden group hover:border-outline transition-colors">
<div class="absolute top-0 left-0 w-1 h-full bg-primary rounded-l-2xl"></div>
<div class="flex justify-between items-start">
<div>

<p class="font-body-base text-body-base text-on-surface-variant">Professional Working Proficiency</p>
</div>
</div>

<div class="w-2.5 h-2.5 rounded-full bg-primary"></div>
<div class="w-2.5 h-2.5 rounded-full bg-primary"></div>
<div class="w-2.5 h-2.5 rounded-full bg-primary"></div>
<div class="w-2.5 h-2.5 rounded-full bg-primary"></div>
<div class="w-2.5 h-2.5 rounded-full bg-outline-variant"></div>
</div>
</div>

</div>
